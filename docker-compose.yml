# CampusMind AI — local infrastructure (Phase 1A)
# PostgreSQL only. Application services are added in later phases.
#
# Usage:
#   copy .env.example to .env
#   docker compose up -d
#   docker compose ps
#   docker compose down

services:
  postgres:
    image: postgres:16
    container_name: campusmind-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusmind}
      POSTGRES_USER: ${POSTGRES_USER:-campusmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusmind}
    volumes:
      - campusmind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  campusmind_postgres_data:
    name: campusmind_postgres_data
